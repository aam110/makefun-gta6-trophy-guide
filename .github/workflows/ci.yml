name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate JSON data
        run: |
          node -e "const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('app/data/trophies.json', 'utf8'));
            if (d.trophies.length !== 55) { console.error('expected 55 trophies, got ' + d.trophies.length); process.exit(1); }
            console.log('trophies.json OK: 55 trophies');
            const s = JSON.parse(fs.readFileSync('shots.json', 'utf8'));
            if (s.length !== 4) { console.error('expected 4 shots, got ' + s.length); process.exit(1); }
            console.log('shots.json OK: 4 screenshots');"
      - name: Syntax-check app scripts
        run: |
          node --input-type=module --check < app/app.js
          node --check app/roadmap.js
          echo "JS syntax OK"
      - name: Check required files
        run: |
          test -f app/index.html && test -f app/app.js && test -f app/style.css && test -f app/roadmap.js && test -f app/data/trophies.json && test -f main.ts && test -f serve.ts && echo "files OK"
